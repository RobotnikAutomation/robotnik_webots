/**:
  controller_manager:
    ros__parameters:
      update_rate: 50

      diffdrive_controller:
        type: diff_drive_controller/DiffDriveController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

  diffdrive_controller:
    ros__parameters:
      left_wheel_names: ["robot_front_left_wheel_joint", "robot_back_left_wheel_joint"]
      right_wheel_names: ["robot_front_right_wheel_joint", "robot_back_right_wheel_joint"]

      wheel_separation: 0.538
      wheel_radius: 0.127

      # The simulated separation between wheels is not resulting in a perfect odometry
      wheel_separation_multiplier: 1.515

      use_stamped_vel: false
      base_frame_id: "base_link"
    
      linear:
        x:
          has_velocity_limits: true
          max_velocity: 0.2
          has_acceleration_limits: true
          max_acceleration: 1.0
      angular:
        z:
          has_velocity_limits: true
          max_velocity: 0.2
          has_acceleration_limits: true
          max_acceleration: 1.0

  joint_state_broadcaster:
    ros__parameters:
      use_sim_time: true
      publish_rate: 200
      extra_joints:
        - robot_arm_shoulder_pan_joint"
        - robot_arm_shoulder_lift_joint"
        - robot_arm_elbow_joint"
        - robot_arm_wrist_1_joint"
        - robot_arm_wrist_2_joint"
        - robot_arm_wrist_3_joint"